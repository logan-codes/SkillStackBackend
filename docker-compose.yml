version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillstack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: Muzz
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: skillstack_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
