version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillstack-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:yourpassword@host.docker.internal:5433/mydb
      - SECRET_KEY=password@123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app:cached
    networks:
      - skillstack-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: skillstack-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
      - POSTGRES_DB=mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillstack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  skillstack-network:
    driver: bridge
